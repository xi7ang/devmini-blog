baseURL = "https://devmini.space/"
languageCode = "zh-cn"
title = "DevMini 博客"
theme = "Mainroad"
summaryLength = 120
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"

[Author]
  name = "Jian Mo"
  bio = "Just start. Done is better than perfect."

[Params]
  description = "DevMini 博客：自建三个免费资源站——免费影视 v.devmini.space（电影/剧集/动漫/综艺）、精品游戏 pan.devmini.space（单机/安卓/怀旧经典）、考试办公 xuexi.devmini.space（考试真题/中小学资料/办公素材）。网盘直链、提取码自动带，点开就能转存。"
  opengraph = true
  twitter_cards = true
  readmore = true
  authorbox = true
  pager = true
  post_meta = ["date", "categories"]
  mainSections = ["posts"]
  toc = true
  googleFontsLink = ""
  customCSS = ["css/custom.css"]

[Params.logo]
  title = "DevMini 博客"
  subtitle = "资源、工具、学习与增长"

[Params.sidebar]
  home = "right"
  list = "right"
  single = "right"
  widgets = ["search", "recent", "categories", "taglist"]

[Params.widgets]
  recent_num = 6
  tags_counter = true

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "film"
  name = "免费影视"
  url = "https://v.devmini.space/"
  weight = 2

[[menu.main]]
  identifier = "game"
  name = "精品游戏"
  url = "https://pan.devmini.space/"
  weight = 3

[[menu.main]]
  identifier = "study"
  name = "考试办公"
  url = "https://xuexi.devmini.space/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "关于我们"
  url = "/about/"
  weight = 5

[[menu.main]]
  identifier = "disclaimer"
  name = "免责声明"
  url = "/disclaimer/"
  weight = 6

[sitemap]
  filename = "sitemap.xml"
  changefreq = "weekly"
  priority = 0.5
